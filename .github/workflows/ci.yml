name: CI

# Runs the tests on every push to main and test, and on pull requests, so a pull request
# into main only merges once they pass.
on:
  push:
    branches: [main, test]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: bash tests/run.sh
