# Stux.Group Status: https://status.stux.group
# Checked every 5 minutes by .github/workflows/status.yml, using GitHup:
# https://github.com/StuxGroup/GitHup
site:
  name: Stux.Group Status
  description: Live status of Stux.Group's websites and services, checked every 5 minutes.
  logo: https://global.media.stux.group/icon.png
  favicon: https://global.media.stux.group/icon.png
  accent: "#0f73ff"
  url: https://status.stux.group/
  footer_links:
    - label: Report a problem
      url: https://github.com/StuxGroup/Status/issues/new

legal:
  operator: Stux.Group
  company: "Stux.Group is the trading name of Stux Group Ltd, a company registered in England and Wales (company no. 13160574), registered office 82a James Carter Road, Mildenhall, England, IP28 7DE."
  contact: legal@stux.group
  host: GitHub Pages
  effective: 29 September 2026

defaults:
  timeout: 15
  retries: 2
  max_response_time: 15000  # ms; GitHup's default. Slower (but otherwise good) answers show as degraded

# Monitors are grouped into sections on the page, each with a combined status.
# Slugs come from the names, so moving a monitor between groups keeps its history.
groups:
  - name: Stux.Group
    description: The Stux.Group websites and the shared media everything else uses.
    monitors:
      - name: Stux.Group
        url: https://stux.group/
        description: The Stux.Group website
      - name: Stux.Group Services
        url: https://services.stux.group/
        description: The directory of Stux.Group services
      - name: Stux.Group Media CDN
        url: https://global.media.stux.group/icon.png
        description: Shared logos and images used across every Stux.Group site

  - name: Brands
    description: Stux.Group's companies.
    monitors:
      - name: Stux.Dev
        url: https://stux.dev/
      - name: Stuxedo
        url: https://stuxedo.com/
        description: Hosting and cloud services
      - name: Stux.Cloud
        url: https://stux.cloud/
        description: The cloud and infrastructure brand behind Stuxedo
      - name: Stux.Music
        url: https://stux.music/

  - name: Services & tools
    description: Stux.Group's own services, as listed on services.stux.group.
    monitors:
      - name: GitHup
        url: https://githup.stux.group/
        description: The GitHup website and demo

  # Each Stux.Cloud/Stuxedo server checks daily that every certificate it uses has more than 21 days
  # left (/usr/local/sbin/cert-expiry-check) and publishes certificates-ok.txt while it does.
  - name: Server certificates
    description: Every certificate on each Stux.Cloud server has more than 21 days left.
    monitors:
      - name: robo1 certificates
        url: https://robo1.servers.uk.stux.cloud/certificates-ok.txt
        description: robo1 (UK)
      - name: tiny1 certificates
        url: https://tiny1.servers.uk.stux.cloud/certificates-ok.txt
        description: tiny1 (UK), including Sm.lol's Cloudflare Origin Certificate
      - name: kitt1 certificates
        url: https://kitt1.servers.ca.stux.cloud/certificates-ok.txt
        description: kitt1 (CA), including Kittens
      - name: mixr1 certificates
        url: https://mixr1.servers.es.stux.cloud/certificates-ok.txt
        description: mixr1 (ES), including Termix

  - name: Elsewhere
    description: Services checked on their own brand's status page.
    links:
      - name: Stux.Dev Status
        url: https://status.stux.dev
        description: Stuxs.Tools, Downl.one, AutoScroll, Sm.lol and Stux.Dev Labs
      - name: StuxAPIs Status
        url: https://status.stuxapis.net
        description: SeasonalOverlaysLibrary, Kittens and SecretGen
      - name: Ream.st Status
        url: https://status.ream.st
        description: Ream.st, Multi.st, Multi.st Twitch and Multi.st YouTube
      - name: Stux.Music Status
        url: https://status.stux.music
        description: Stux.Music's artist sites, including Stux Sharp

incidents:
  labels: [status]
